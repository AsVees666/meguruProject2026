<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マイページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
  <style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4eee5;
}

body {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#art {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  flex: none;
}

    /* メールアドレスは長いため、行内に収まるサイズに調整 */
    #_登録メールアドレス text { font-size: 16px; }
    /* SVGの見た目は変えず、透明な当たり判定だけをクリック可能にする */
    #_メアドボタン当たり判定,
    #_セキュリティ当たり判定,
    #_暗号設定あたり判定,
    #_ログアウトあたり判定,
    #_ホーム, #_カレンダー, #_マイページ, #_検索 {
      cursor: pointer;
      pointer-events: all;
    }
    #_メアドボタン当たり判定 rect,
    #_セキュリティ当たり判定 rect,
    #_暗号設定あたり判定 rect,
    #_ログアウトあたり判定 rect {
      pointer-events: all;
    }
    .dialog-backdrop {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center;
      padding: 20px; background: rgba(48, 39, 31, .38);
    }
    .dialog-backdrop.is-open { display: flex; }
    .dialog {
      width: min(100%, 420px); max-height: 85vh; overflow-y: auto;
      padding: 28px 24px; border-radius: 14px;
      background: #fbf8f2; border: 1px solid #d8c3a5;
      box-shadow: 0 8px 28px rgba(50, 35, 20, .18);
    }
    .dialog h2 { margin: 0 0 18px; font-size: 20px; font-weight: 600; text-align: center; }
    .dialog p { line-height: 1.8; font-size: 14px; }
    .dialog label { display: block; margin: 14px 0 6px; font-size: 13px; }
    .dialog input {
      width: 100%; padding: 11px 12px; border: 1px solid #cbb79d;
      border-radius: 7px; background: #fffdfa; color: #5f4b3a; font: inherit;
    }
    .dialog-actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .dialog button {
      min-width: 112px; padding: 10px 18px; border-radius: 7px;
      border: 1px solid #9b8064; background: #9b8064; color: white;
      font: inherit; cursor: pointer;
    }
    .dialog button.secondary { background: transparent; color: #80684f; }
    .dialog button:focus-visible, .dialog input:focus-visible { outline: 2px solid #8b6f55; outline-offset: 2px; }
    .note { color: #8b7968; font-size: 12px !important; }
    .status { padding: 12px; border-radius: 7px; background: #f2eadf; }
    @media (max-width: 480px) {
      .dialog { padding: 24px 18px; }
    }
  </style>
</head>

  <!-- 各ボタンから開くダイアログ。今は画面表示のみで、認証などの実処理は未接続です。 -->
  <div class="dialog-backdrop" id="dialogBackdrop" role="presentation">
    <section class="dialog" id="dialogPanel" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle"></h2>
      <div id="dialogContent"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </section>
  </div>

  <script>
    // ページ移動先。実際のファイル名に合わせて変更できます。
    const PAGE_URLS = {
      home: "Home.html",
      calendar: "calendar.html",
      mypage: "mypage.html",
      search: "kensaku.html"
    };

    const backdrop = document.getElementById("dialogBackdrop");
    const title = document.getElementById("dialogTitle");
    const content = document.getElementById("dialogContent");
    const actions = document.getElementById("dialogActions");

    // ダイアログを開く共通処理
    function openDialog(dialogTitle, bodyHTML, buttons) {
      title.textContent = dialogTitle;
      content.innerHTML = bodyHTML;
      actions.innerHTML = "";
      buttons.forEach(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.label;
        if (item.secondary) button.className = "secondary";
        button.addEventListener("click", item.onClick);
        actions.appendChild(button);
      });
      backdrop.classList.add("is-open");
      const firstButton = actions.querySelector("button");
      if (firstButton) firstButton.focus();
    }

    // ダイアログを閉じる共通処理
    function closeDialog() {
      backdrop.classList.remove("is-open");
    }

    function addClick(id, label, callback) {
      const element = document.getElementById(id);
      if (!element) return;
      element.setAttribute("role", "button");
      element.setAttribute("tabindex", "0");
      element.setAttribute("aria-label", label);
      element.addEventListener("click", callback);
      element.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          callback();
        }
      });
    }

    // Home.htmlと同じ方式で、アイコンの周囲に透明なクリック範囲を追加します。
    function addHitArea(groupId, label, action) {
      const group = document.querySelector("#art #" + CSS.escape(groupId));
      if (!group || group.querySelector(".hit-area")) return;

      let bounds;
      try {
        bounds = group.getBBox();
      } catch (error) {
        return;
      }
      if (!bounds.width || !bounds.height) return;

      const hit = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      hit.classList.add("hit-area");
      hit.setAttribute("x", bounds.x - 8);
      hit.setAttribute("y", bounds.y - 8);
      hit.setAttribute("width", bounds.width + 16);
      hit.setAttribute("height", bounds.height + 16);
      hit.setAttribute("fill", "transparent");
      hit.setAttribute("pointer-events", "all");
      hit.setAttribute("role", "button");
      hit.setAttribute("tabindex", "0");
      hit.setAttribute("aria-label", label);
      hit.style.cursor = "pointer";
      hit.addEventListener("click", action);
      hit.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          action();
        }
      });
      group.appendChild(hit);
    }

    // 下部ナビゲーション：各ページへ移動します。
    addHitArea("_ホーム", "ホーム", () => {
      window.location.href = PAGE_URLS.home;
    });
    addHitArea("_カレンダー", "カレンダー", () => {
      window.location.href = PAGE_URLS.calendar;
    });
    addHitArea("_検索", "検索", () => {
      window.location.href = PAGE_URLS.search;
    });
    addHitArea("_マイページ", "マイページ", () => {
      window.location.href = PAGE_URLS.mypage;
    });

    // 登録メールアドレス：現段階では仮表示。Supabase接続後にログイン中のメールへ置き換えます。
    addClick("_メアドボタン当たり判定", "登録メールアドレス", () => {
      openDialog("登録メールアドレス",
        '<p>現在登録されているメールアドレス</p><p class="status">sample@example.com</p><p class="note">※ 現在は表示確認用の仮アドレスです。ログイン機能の接続後、登録済みのメールアドレスを自動表示します。</p>',
        [{label:"閉じる", secondary:true, onClick:closeDialog}]);
    });

    // セキュリティ：パスワード変更画面（まだ変更処理は行いません）。
    addClick("_セキュリティ当たり判定", "セキュリティ・パスワード変更", () => {
      openDialog("パスワードの変更",
        '<p>新しいログインパスワードを設定します。</p>' +
        '<label for="newPassword">新しいパスワード</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード">' +
        '<label for="confirmPassword">新しいパスワード（確認）</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="もう一度入力">' +
        '<p class="note">※ 現在は画面の確認用です。Supabase接続後に安全なパスワード変更処理を追加します。</p>',
        [{label:"閉じる", secondary:true, onClick:closeDialog}, {label:"変更する", onClick:() => alert("パスワード変更機能は、ログイン機能の接続後に有効になります。")}]);
    });

    // 暗号設定：設定画面の入口のみ。暗号化・鍵の保存はまだ実行しません。
    addClick("_暗号設定あたり判定", "日記の暗号化設定", () => {
      openDialog("日記の暗号化設定",
        '<p>日記を保護するための設定です。</p><p class="status">暗号化：未設定</p><p>暗号化キーの設定・変更・復旧方法は、安全な保存方法を決めてから実装します。</p><p class="note">※ この画面は案内表示のみで、現在は日記データの暗号化は行っていません。</p>',
        [{label:"閉じる", secondary:true, onClick:closeDialog}, {label:"設定について", onClick:() => alert("暗号化キーの仕組みは、設計を確定してから実装します。")}]);
    });

    // ログアウト：確認画面のみ。認証セッションの終了は未接続です。
    addClick("_ログアウトあたり判定", "ログアウト", () => {
      openDialog("ログアウトしますか？",
        '<p>ログアウトすると、この端末でのログイン状態が終了します。</p><p class="note">※ 現在は確認画面のみです。実際のログアウト処理はSupabase接続後に追加します。</p>',
        [{label:"キャンセル", secondary:true, onClick:closeDialog}, {label:"ログアウト", onClick:() => { closeDialog(); alert("ログアウト機能は、ログイン機能の接続後に有効になります。"); }}]);
    });

   

    // 背景部分を押したときも閉じる。ダイアログ内部を押した場合は閉じません。
    backdrop.addEventListener("click", event => {
      if (event.target === backdrop) closeDialog();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDialog();
    });
  </script>
