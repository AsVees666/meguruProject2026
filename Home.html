<script>
(() => {
  "use strict";

  const svg = document.getElementById("art");
  const NS = "http://www.w3.org/2000/svg";

  // 各ボタンの移動先ページ
  const PAGES = {
    home: "Home.html",
    menu: "menu.html",
    record: "kiroku.html",
    search: "kensaku.html",
    mypage: "mypage.html",
    calendar: "calendar.html",
  };

  // 初期状態ではサンプル日記を表示しない。
  // 保存機能がまだ接続されていない場合は、日記0件として扱う。

  // 今日の日付を「YYYY-MM-DD」で取得する。
  function localDateString(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  // 振り返り日付は「YYYY.MM.DD」で表示する。
  function displayDate(date) {
    return date.replaceAll("-", ".");
  }

  // 今日の日付は「YYYY.MM.DD」で表示する（例：2026.10.29）。
function displayTodayDate(date) {
  const match = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return date;
  return `${match[1]}.${match[2]}.${match[3]}`;
}

  // 保存されている日記を読み込む。
  // 日記データがなければ空の配列を返す。
  function readEntries() {
    try {
      const saved = localStorage.getItem("diaryEntries");

      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {
      console.warn("日記データを読み込めませんでした。", e);
    }

    return [];
  }

  // 今日より前の日付の日記から、振り返りに表示する1件を選ぶ。
  // 文章がなくても、感情が記録されていれば候補に含める。
  function dailyEntry(entries, today) {
    const eligible = entries.filter(e =>
      e &&
      typeof e.date === "string" &&
      e.date < today &&
      (
        (typeof e.body === "string" && e.body.trim().length > 0) ||
        e.hasFeeling === true ||
        e.feelingRecorded === true ||
        Boolean(e.emotion)
      )
    );

    if (!eligible.length) return null;

    try {
      // 同じ日の間は、選んだ振り返り日記を維持する。
      const savedDate = localStorage.getItem("diaryReflectionDate");
      const savedId = localStorage.getItem("diaryReflectionEntryId");
      const existing = eligible.find(e => e.id === savedId);

      if (savedDate === today && existing) return existing;

      // 最近表示した日記が続けて選ばれにくいようにする。
      let recent = JSON.parse(
        localStorage.getItem("diaryRecentReflectionIds") || "[]"
      );

      let candidates = eligible.filter(e => !recent.includes(e.id));

      if (!candidates.length) candidates = eligible;

      // 日付を使って、その日の候補を1件選ぶ。
      const seed = Number(today.replaceAll("-", ""));
      const selected = candidates[seed % candidates.length];

      localStorage.setItem("diaryReflectionDate", today);
      localStorage.setItem("diaryReflectionEntryId", selected.id);

      recent = [
        selected.id,
        ...recent.filter(id => id !== selected.id)
      ].slice(0, 5);

      localStorage.setItem(
        "diaryRecentReflectionIds",
        JSON.stringify(recent)
      );

      return selected;
    } catch (e) {
      return eligible[0];
    }
  }

  // SVG内の指定した文字を書き換える。
  function setText(groupId, value) {
    const group = svg.querySelector("#" + CSS.escape(groupId));
    const text = group?.querySelector("text");

    if (!text) return;

    const tspan = text.querySelector("tspan");

    if (tspan) {
      tspan.textContent = value;
    } else {
      text.textContent = value;
    }
  }

  // 指定した場所に感情マーク画像を表示する。
  // 画像ファイルはmarksフォルダ内に用意する。
  function addImage(groupId, src, label) {
    const group = svg.querySelector("#" + CSS.escape(groupId));
    const rect = group?.querySelector("rect");

    if (!group || !rect) return;

    // すでに追加されていたら二重表示しない。
    if (group.querySelector(".dynamic-mark")) return;

    const image = document.createElementNS(NS, "image");

    image.classList.add("dynamic-mark");
    image.setAttribute("x", rect.getAttribute("x"));
    image.setAttribute("y", rect.getAttribute("y"));
    image.setAttribute("width", rect.getAttribute("width"));
    image.setAttribute("height", rect.getAttribute("height"));
    image.setAttribute("preserveAspectRatio", "xMidYMid meet");
    image.setAttribute("href", src);
    image.setAttribute("aria-label", label);
    image.setAttribute("pointer-events", "none");

    group.appendChild(image);
  }

  // 振り返りカードの本文欄を設定する。
  function setExcerpt(entry) {
    const group = svg.querySelector("#_テキストボックス");

    if (!group) return;

    // 前回表示した本文・案内文があれば削除する。
    group.querySelector(".diary-excerpt")?.remove();

    // 過去の日記が0件のときだけ案内文を表示する。
    if (!entry) {
      const prompt = document.createElementNS(NS, "text");

      prompt.classList.add("diary-excerpt");
      prompt.setAttribute("x", "344");
      prompt.setAttribute("y", "800");
      prompt.setAttribute("fill", "#8b6f55");
      prompt.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
      prompt.setAttribute("font-size", "20");
      prompt.setAttribute("pointer-events", "none");
      prompt.textContent = "日記をつけてみましょう";

      group.insertBefore(prompt, group.querySelector("rect") || null);
      return;
    }

    // 日記が存在しても本文が空なら、本文欄には何も表示しない。
    // 感情だけ記録した日記の場合は、このまま空欄にする。
    if (typeof entry.body !== "string" || !entry.body.trim()) return;

    const text = document.createElementNS(NS, "text");

    text.classList.add("diary-excerpt");
    text.setAttribute("x", "344");
    text.setAttribute("y", "776");
    text.setAttribute("fill", "#8b6f55");
    text.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
    text.setAttribute("font-weight", "400");
    text.setAttribute("font-size", "20");
    text.setAttribute("pointer-events", "none");

    // 本文の先頭部分を抜き出す。長い場合は末尾に「…」を付ける。
    const chars = Array.from(entry.body.trim());

    const excerpt = chars.length > 22
      ? chars.slice(0, 21).join("") + "…"
      : chars.join("");

    // 1行目：最大11文字
    const line1 = document.createElementNS(NS, "tspan");
    line1.setAttribute("x", "344");
    line1.textContent = Array.from(excerpt).slice(0, 11).join("");
    text.appendChild(line1);

    // 2行目：残りの文字
    const secondText = Array.from(excerpt).slice(11).join("");

    if (secondText) {
      const line2 = document.createElementNS(NS, "tspan");
      line2.setAttribute("x", "344");
      line2.setAttribute("dy", "30");
      line2.textContent = secondText;
      text.appendChild(line2);
    }

    // 枠線より前に本文テキストを置く。
    const border = group.querySelector("rect");
    group.insertBefore(text, border || null);
  }

  // SVGの図形に透明なクリック範囲を追加する。
  function addHitArea(groupId, label, action) {
    const group = svg.querySelector("#" + CSS.escape(groupId));

    if (!group || group.querySelector(".hit-area")) return;

    let bounds;

    try {
      bounds = group.getBBox();
    } catch (e) {
      return;
    }

    if (!bounds.width || !bounds.height) return;

    const hit = document.createElementNS(NS, "rect");

    hit.classList.add("hit-area");
    hit.setAttribute("x", bounds.x - 8);
    hit.setAttribute("y", bounds.y - 8);
    hit.setAttribute("width", bounds.width + 16);
    hit.setAttribute("height", bounds.height + 16);
    hit.setAttribute("fill", "transparent");
    hit.setAttribute("pointer-events", "all");
    hit.setAttribute("role", "button");
    hit.setAttribute("tabindex", "0");
    hit.setAttribute("aria-label", label);
    hit.style.cursor = "pointer";

    // マウス・タップでクリックされたとき
    hit.addEventListener("click", action);

    // キーボードのEnterまたはSpaceでも操作できるようにする。
    hit.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        action();
      }
    });

    group.appendChild(hit);
  }

  // 指定したページへ移動する。必要な日付やモードもURLに付ける。
  function navigate(page, params = {}) {
    const url = new URL(PAGES[page], location.href);

    Object.entries(params).forEach(([key, value]) => {
      url.searchParams.set(key, value);
    });

    location.href = url.href;
  }

  // ----------------------------------------
  // ホーム画面の初期表示
  // ----------------------------------------

  const today = localDateString();
  const entries = readEntries();
  const entry = dailyEntry(entries, today);

  // 今日の日付を自動更新して「M/D」で表示する。
  setText("_今日の日付", displayTodayDate(today));

  if (entry) {
    // 振り返り日記がある場合

    // 選んだ日記の日付を表示する。
    setText("_振り返り日付", displayDate(entry.date));

    // 本文の有無に応じて本文欄を設定する。
    setExcerpt(entry);

    // 選んだ日記の感情マークを表示する。
    if (entry.emotion) {
      addImage(
        "_マーク位置_振り返り_",
        `marks/${entry.emotion}.png`,
        entry.emotion
      );
    }

    const hasBody =
      typeof entry.body === "string" &&
      Boolean(entry.body.trim());

    const hasFeeling =
      entry.hasFeeling === true ||
      entry.feelingRecorded === true ||
      Boolean(entry.emotion);

    const feeling = svg.querySelector("#_感情バーを見るボタン");
    const read = svg.querySelector("#_続きを読む");

    // 感情だけの記録なら「感情バーを見る」を表示する。
    if (feeling) {
      feeling.style.display = !hasBody && hasFeeling ? "" : "none";
    }

    // 文章がある記録なら「続きを読む」を表示する。
    if (read) {
      read.style.display = hasBody ? "" : "none";
    }

    // 「続きを読む」→ kiroku.html（過去の日記を読むモード）
    if (hasBody) {
      addHitArea("_続きを読む", "続きを読む", () =>
        navigate("record", {
          date: entry.date,
          mode: "read"
        })
      );
    }

    // 「感情バーを見る」→ kiroku.html（感情を見るモード）
    else if (hasFeeling) {
      addHitArea("_感情バーを見るボタン", "感情バーを見る", () =>
        navigate("record", {
          date: entry.date,
          mode: "feeling"
        })
      );
    }

  } else {
    // 過去の日記が0件の場合
    // 日付と感情マークは隠すが、本文枠は残して案内文を表示する。

    svg.querySelector("#_振り返り日付")
      ?.style.setProperty("display", "none");

    svg.querySelector("#_マーク位置_振り返り_")
      ?.style.setProperty("display", "none");

    // 本文枠に「日記をつけてみましょう」と表示する。
    setExcerpt(null);

    // 日記がないので、振り返り用のボタンは隠す。
    svg.querySelector("#_感情バーを見るボタン")
      ?.style.setProperty("display", "none");

    svg.querySelector("#_続きを読む")
      ?.style.setProperty("display", "none");
  }

  // 画面上部の固定マークを表示する。
  // marksフォルダに「固定マーク.png」を用意する。
  addImage(
    "_マーク位置_画面上部_",
    "marks/固定マーク.png",
    "固定マーク"
  );

  // ----------------------------------------
  // 各ボタンの場所と移動先
  // ----------------------------------------

  // 画面下部のホームアイコン → index.html
  addHitArea("_ホーム", "ホーム", () =>
    navigate("home")
  );

  // 画面下部のカレンダーアイコン → calendar.html
  addHitArea("_カレンダー", "カレンダー", () =>
    navigate("calendar")
  );

  // 画面下部の検索アイコン → kensaku.html
  addHitArea("_検索", "検索", () =>
    navigate("search")
  );

  // 画面下部の人物アイコン → mypage.html
  addHitArea("_マイページ", "マイページ", () =>
    navigate("mypage")
  );

  // 画面左上の三本線 → menu.html
  addHitArea("_メニュー", "メニュー", () =>
    navigate("menu")
  );

  // 画面下部の「＋日記を書く」ボタン
  // → kiroku.html（今日の日付・新規記録モード）
  addHitArea("_記録ボタン", "日記を書く", () =>
    navigate("record", {
      date: today,
      mode: "new"
    })
  );

})();
</script>

</body>
</html>
